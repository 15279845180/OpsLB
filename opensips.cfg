# OpenSIPS 3.6.4 Configuration for OpsLB
# V2.5 - 接口合并版：一次HTTP完成入局授权+选路+出局授权
#
# OpenSIPS 职责:
#   - SIP 信令接收、转发、路由
#   - IP 白名单检查（第一道防线）
#   - Dialog 状态跟踪
#   - 向 Go 申请授权（allocate）后执行动作
#
# Go 职责（唯一并发权威）:
#   - /api/call/allocate - 一体化分配（入局授权+选路+出局授权）
#   - /api/call/release  - 释放并发 + 结束话单
#   - /api/route/event   - 话单状态更新（answer/failed事件）
#
# 启动: opensips -m 2048 -M 256

# ------------------ Global Parameters ------------------
# 生产环境日志级别: 2=NOTICE(推荐), 3=INFO, 4=DEBUG(仅调试)
log_level=2
stderror_enabled=no
syslog_enabled=yes
syslog_facility=LOG_LOCAL0

# 禁用DNS解析(所有通信使用IP地址,无需域名解析,减少延迟)
dns=no
rev_dns=no
auto_aliases=no

# Worker数量: 根据CPU核数调整,建议 CPU核数×2
# 当前服务器假设为8核,udp/tcp各16个worker
udp_workers=8
tcp_workers=2

socket=udp:192.168.1.168:5060
socket=tcp:192.168.1.168:5060

# ------------------ Modules ------------------
mpath="/usr/local/lib64/opensips/modules/"

loadmodule "db_mysql.so"
loadmodule "proto_udp.so"
loadmodule "proto_tcp.so"
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "sipmsgops.so"
loadmodule "dialog.so"
loadmodule "permissions.so"
loadmodule "rest_client.so"
loadmodule "httpd.so"
loadmodule "mi_http.so"
loadmodule "json.so"
loadmodule "nathelper.so"

modparam("httpd", "port", 8889)
modparam("httpd", "ip", "127.0.0.1")

modparam("permissions", "db_url", "mysql://OpsLB:YsmywJkcSTCcdw2J@127.0.0.1:3306/opslb")
modparam("permissions", "address_table", "cfg_inbound_ips")

modparam("dialog", "db_url", "mysql://OpsLB:YsmywJkcSTCcdw2J@127.0.0.1:3306/opslb")
modparam("dialog", "dlg_match_mode", 0)  # 0=手动match_dialog()，1=自动匹配(dialog模块内部消费BYE，脚本无法处理)
modparam("dialog", "default_timeout", 3600)
modparam("dialog", "db_mode", 0)

modparam("tm", "fr_timeout", 10)
modparam("tm", "fr_inv_timeout", 120)
modparam("tm", "wt_timer", 20)
modparam("tm", "delete_timer", 120)
modparam("tm", "T1_timer", 500)
modparam("tm", "T2_timer", 4000)

# 【申请-授权模式】rest_client调优：高并发场景下增加超时阈值
modparam("rest_client", "connection_timeout", 1)   # TCP建连1秒（降低超时）
modparam("rest_client", "curl_timeout", 1)          # HTTP读写1秒（降低超时）
# 注意：OpenSIPS 3.6.4 rest_client模块不支持max_connections和keep_connections参数
# 关键优化：非关键路径的HTTP调用（release/event）使用更短的超时，避免阻塞Worker

modparam("rr", "enable_double_rr", 1)

# ------------------ Routing ------------------
route {
    if (!mf_process_maxfwd_header(10)) {
        sl_send_reply(483, "Too Many Hops");
        exit;
    }
    if (is_method("OPTIONS")) {
        sl_send_reply(200, "OK");
        exit;
    }
    route(INBOUND);
}

route[INBOUND] {
    # Go API基地址（allocate用变量，release/event因async跨进程问题需硬编码）
    $var(go_api_base) = "http://127.0.0.1:8080/api/call";

    # ========== CANCEL ==========
    if (is_method("CANCEL")) {
        if (match_dialog()) {
            $var(c_cid) = $dlg_val(call_id);
        } else {
            $var(c_cid) = $ci;  # dialog未创建，用$ci兜底
        }

        # 【恢复】CANCEL必须同步释放并发，否则会泄漏
        $var(body) = "{\"call_id\":\"" + $var(c_cid) + "\",\"reason\":\"cancel\"}";
        rest_post("http://127.0.0.1:8080/api/call/release", $var(body), "application/json", $var(dummy));

        if (t_check_trans()) { t_relay(); } else { sl_send_reply(481, "Call Leg Does Not Exist"); }
        exit;
    }

    # ========== SEQUENTIAL REQUESTS (has to-tag) ==========
    # 【B2BUA兼容模式】借鉴VOS3000做法：完全依赖dialog维护会话状态
    # 不依赖Route头/loose_route()，兼容不规范的UAC实现
    if (has_totag()) {
        # 【优先方案】直接从dialog获取对端地址（B2BUA行为）
        if (match_dialog()) {
            # dialog匹配成功，$du已自动设置为对端地址
            xlog("L_INFO", "[SEQ] dialog matched, $du=$du, call_id=$ci");

            if (is_method("BYE")) {
                # 【恢复】BYE必须同步释放并发，否则会泄漏
                $var(b_cid) = $dlg_val(call_id);
                $var(body) = "{\"call_id\":\"" + $var(b_cid) + "\",\"reason\":\"bye\"}";
                rest_post("http://127.0.0.1:8080/api/call/release", $var(body), "application/json", $var(dummy));
                route(RELAY);
            } else if (is_method("INVITE")) {
                # re-INVITE（心跳检测等）
                $var(nat_flags) = 8;
                if (nat_uac_test($var(nat_flags))) {
                    fix_nated_contact();
                    if (has_body_part("application/sdp")) {
                        $var(sdp_port) = 10;
                        fix_nated_sdp($var(sdp_port));
                    }
                }
                route(RELAY);
            } else {
                # ACK / PRACK / UPDATE / INFO / REFER
                route(RELAY);
            }
        } else {
            # 【兜底方案】dialog匹配失败，尝试loose_route()
            xlog("L_WARN", "[SEQ] match_dialog failed, fallback to loose_route, call_id=$ci");
            if (loose_route()) {
                xlog("L_INFO", "[SEQ] loose_route fallback OK, $du=$du, call_id=$ci");
                # 【恢复】BYE必须同步释放并发
                if (is_method("BYE")) {
                    $var(body) = "{\"call_id\":\"" + $ci + "\",\"reason\":\"bye\"}";
                    rest_post("http://127.0.0.1:8080/api/call/release", $var(body), "application/json", $var(dummy));
                }
                route(RELAY);
            } else {
                # 最终兜底：事务内ACK（487/404等错误响应后）
                if (is_method("ACK") && t_check_trans()) {
                    xlog("L_INFO", "[ACK] transaction ACK (no dialog, no Route), forwarding call_id=$ci");
                    t_relay();
                    exit;
                }
                xlog("L_WARN", "[SEQ] all routing failed for $rm, 404 reply, call_id=$ci");
                sl_send_reply(404, "Not here");
            }
        }
        exit;
    }

    # ========== INITIAL REQUESTS (no to-tag) ==========
    if (is_method("OPTIONS")) {
        sl_send_reply(200, "OK");
        exit;
    }

    if (!check_source_address(0)) { drop(); exit; }

    if (is_method("INVITE")) {
        route(OUTBOUND);
    } else {
        sl_send_reply(405, "Method Not Allowed");
        exit;
    }
}

route[RELAY] {
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

route[OUTBOUND] {
    # 【V2.5 接口合并】一次HTTP完成 入局授权+选路+出局授权（从3次降到1次）
    $var(body) = "{\"call_id\":\"" + $ci + "\",\"caller\":\"" + $fU + "\",\"called\":\"" + $rU + "\",\"inbound_ip\":\"" + $si + "\"}";
    async(rest_post("$var(go_api_base)/allocate",
                    $var(body), "application/json", $var(resp_body)),
          RESUME_ALLOCATE);
    exit;
}

route[RESUME_ALLOCATE] {
    # 修复: async回调可能在不同进程执行，重新初始化全局变量
    $var(go_api_base) = "http://127.0.0.1:8080/api/call";

    # 检查响应
    if ($(var(resp_body){s.len}) == 0) {
        xlog("L_ERR", "[ALLOCATE] allocate failed, empty response, call_id=$ci");
        $var(body) = "{\"type\":\"failed\",\"call_id\":\"" + $ci + "\",\"status_code\":504}";
        rest_post("http://127.0.0.1:8080/api/route/event", $var(body), "application/json", $var(dummy));
        sl_send_reply(503, "Service Unavailable");
        exit;
    }

    $json(resp) := $var(resp_body);
    if ($json(resp) == null) {
        xlog("L_ERR", "[ALLOCATE] json parse failed, call_id=$ci");
        $var(body) = "{\"type\":\"failed\",\"call_id\":\"" + $ci + "\",\"status_code\":500}";
        rest_post("http://127.0.0.1:8080/api/route/event", $var(body), "application/json", $var(dummy));
        sl_send_reply(503, "Service Unavailable");
        exit;
    }

    $var(allowed)     = $json(resp/allowed);
    $var(inbound_id)  = $json(resp/inbound_id);
    $var(gateway_id)  = $json(resp/gateway_id);
    $var(gw_ip)       = $json(resp/gateway_ip);
    $var(gw_port)     = $json(resp/gateway_port);
    $var(error_code)  = $json(resp/error_code);

    xlog("L_INFO", "[ALLOCATE] response: allowed=$var(allowed), inbound=$var(inbound_id), gateway=$var(gateway_id), call_id=$ci");

    if ($var(allowed) != 1) {
        if ($var(error_code) == "" || $var(error_code) == "0") { $var(error_code) = "-5"; }
        xlog("L_INFO", "[ALLOCATE] not allowed (error_code=$var(error_code)), call_id=$ci");
        # 释放已授权并发（Go侧已回滚，此处兜底释放）
        $var(body) = "{\"call_id\":\"" + $ci + "\",\"reason\":\"failed\",\"status_code\":" + $var(error_code) + "}";
        rest_post("http://127.0.0.1:8080/api/call/release", "$var(body)", "application/json", $var(dummy));
        t_reply(503, "Service Unavailable");
        exit;
    }

    # 构建出局URI
    $var(gw_uri) = "sip:" + $rU + "@" + $var(gw_ip) + ":" + $var(gw_port);

    # 【关键】先设置$du，再create_dialog()
    $du = $var(gw_uri);

    # 创建Dialog，存储变量（供BYE/CANCEL/ACK使用）
    $var(client_uri) = "sip:" + $rU + "@" + $si + ":" + $sp;
    create_dialog("B");
    store_dlg_value("call_id",    $ci);
    store_dlg_value("gw_uri",     $var(gw_uri));
    store_dlg_value("gateway_id", $var(gateway_id));
    store_dlg_value("inbound_id", $var(inbound_id));
    store_dlg_value("client_uri", $var(client_uri));
    store_dlg_value("client_ip",  $si);

    dlg_on_timeout("DLG_TIMEOUT_HANDLER");
    record_route();
    t_on_failure("FAILOVER");

    # 转发INVITE到出局网关
    if (!t_relay()) {
        xlog("L_ERR", "[ALLOCATE] t_relay failed for call_id=$ci");
        $var(body) = "{\"type\":\"failed\",\"call_id\":\"" + $ci + "\",\"status_code\":500}";
        rest_post("http://127.0.0.1:8080/api/route/event", "$var(body)", "application/json", $var(dummy));
        sl_reply_error();
    }
}

onreply_route {
    if (!is_method("INVITE")) { return; }
    if ($rs >= 100 && $rs < 200) { return; }

    if ($rs >= 200 && $rs < 300) {
        # 200 OK：存储UAS的Contact地址到dialog（关键！）
        # match_dialog()匹配成功后，$du需要从这个地址获取
        if ($ct != "" && $ct != $ru) {
            store_dlg_value("uas_contact", $ct);
            xlog("L_INFO", "[200OK] stored uas_contact=$ct, call_id=$ci");
        }

        # 200 OK：异步上报answer事件，更新话单接通时间
        $var(body) = "{\"type\":\"answer\",\"call_id\":\"" + $ci + "\",\"status_code\":200}";
        async(rest_post("http://127.0.0.1:8080/api/route/event",
                        $var(body), "application/json", $var(dummy)),
              ANSWER_EVENT_DONE);
        # ACK 超时检测：30秒内未收到 ACK 触发超时回调
        $DLG_timeout = 30;
        return;
    }

    if ($rs >= 300) {
        # 【恢复】3xx-6xx必须同步释放并发，否则会泄漏
        $var(body) = "{\"type\":\"failed\",\"call_id\":\"" + $ci + "\",\"status_code\":" + $rs + "}";
        rest_post("http://127.0.0.1:8080/api/route/event", $var(body), "application/json", $var(dummy));
    }
}

failure_route[FAILOVER] {
    $var(f_cid) = $dlg_val(call_id);
    $var(status) = $T_reply_code;
    if ($var(status) == 0) { $var(status) = 408; }

    xlog("L_INFO", "[FAILOVER] call_id=$var(f_cid) status=$var(status)");

    # 【恢复】failure_route必须同步释放并发，否则会泄漏
    $var(body) = "{\"call_id\":\"" + $var(f_cid) + "\",\"reason\":\"failed\",\"status_code\":" + $var(status) + "}";
    rest_post("http://127.0.0.1:8080/api/call/release", "$var(body)", "application/json", $var(dummy));
}

# Answer事件异步回调（fire-and-forget，无需处理响应）
route[ANSWER_EVENT_DONE] {
    # answer事件仅更新话单，无需额外处理
    return;
}

# Dialog 超时回调 - ACK 超时后触发
route[DLG_TIMEOUT_HANDLER] {
    $var(cid) = $dlg_val(call_id);
    xlog("L_ERR", "[DLG_TIMEOUT] call_id=$var(cid) ACK timeout");
    # 【恢复】超时回调必须同步释放并发，否则会泄漏
    $var(body) = "{\"call_id\":\"" + $var(cid) + "\",\"reason\":\"failed\",\"status_code\":408}";
    rest_post("http://127.0.0.1:8080/api/call/release", "$var(body)", "application/json", $var(dummy));
}